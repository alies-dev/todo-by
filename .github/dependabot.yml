version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: quarterly
    # One PR per quarter for all crates instead of one PR per crate.
    # Security updates are unaffected: they ignore the schedule and still
    # open immediately as individual PRs.
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns:
          - "*"
