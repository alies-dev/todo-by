[package]
name = "todo-by-cli"
version = "0.5.0"
edition = "2021"
# Floor set by the `ignore` dependency, which declares rust-version 1.88 from
# 0.4.31 on. Single source of truth: the msrv job in CI reads this field, and
# so does clippy.
rust-version = "1.88"
description = "Flag todo-by tags whose deadline has passed, whose target version has shipped, or whose GitHub issue or pull request has closed, across any file type"
license = "MIT"
repository = "https://github.com/alies-dev/todo-by"
readme = "README.md"
# Whitelist the packaged files so local scratch dirs can never leak into
# a published crate.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = ["todo", "deadline", "linter", "ci", "comments"]
categories = ["command-line-utilities", "development-tools"]
# MSRV-aware resolution (cargo 1.84+): `cargo update` and `cargo add` prefer
# versions whose own rust-version fits ours, so the committed lockfile stays
# buildable on the MSRV toolchain. Dependabot resolves through the crates.io
# API and ignores this, so the msrv job is what catches its bumps.
resolver = "3"

[[bin]]
name = "todo-by"
path = "src/main.rs"

[dependencies]
# ripgrep's walker: full gitignore semantics + parallel directory traversal.
ignore = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
