# Tracks the statistical performance baseline on main for Bencher
# (https://bencher.dev/perf/todo-by). PR runs (benchmark.yml) compare
# against this baseline.
name: Benchmark base

on:
  push:
    branches: [main]

env:
  # Keep in sync with benchmark.yml.
  CORPUS_REPO: angular/angular
  CORPUS_REF: v22.0.6

jobs:
  benchmark:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install hyperfine
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: hyperfine

      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13

      - name: Fetch corpus
        run: git clone --depth 1 --branch "$CORPUS_REF" "https://github.com/$CORPUS_REPO" /tmp/corpus

      - name: Build binary
        run: cargo build --release --locked

      - name: Track base benchmarks
        run: |
          bencher run \
            --project todo-by \
            --key '${{ secrets.BENCHER_API_KEY }}' \
            --branch main \
            --testbed ubuntu-latest \
            --adapter shell_hyperfine \
            --file results.json \
            "hyperfine --warmup 3 --min-runs 10 --ignore-failure --command-name 'scan angular/angular' --export-json results.json './target/release/todo-by /tmp/corpus'"
